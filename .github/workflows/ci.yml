name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The suites never launch Electron. They reach main.js through a stubbed
      # electron require, so the runtime binary is a few hundred megabytes of
      # download for nothing.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Optional deps are skipped on purpose. That leaves ffmpeg-static out,
      # which is the case the poster fallback exists for, so CI exercises the
      # path a plain install actually takes.
      - run: npm ci --omit=optional

      - run: npx playwright install --with-deps chromium

      - run: npm test

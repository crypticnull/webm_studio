<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; media-src clip:; img-src clip: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'">
<title>Loop Viewer</title>
<style>
    :root {
        --bg: #000;
        --chrome: #141414;
        --line: #2a2a2a;
        --ink: #d8d8d8;
        --dim: #8a8a8a;
        --bad: #ff5f56;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.4 system-ui, "Segoe UI", sans-serif;
        overflow: hidden;
        user-select: none;
    }

    body { display: flex; flex-direction: column; }

    header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        background: var(--chrome);
        border-bottom: 1px solid var(--line);
        flex: 0 0 auto;
    }

    button, select, input {
        font: inherit;
        color: var(--ink);
        background: #1e1e1e;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 4px 8px;
    }

    button { cursor: pointer; }
    button:hover:not(:disabled) { background: #2a2a2a; }
    button:disabled { opacity: .4; cursor: default; }
    button.on { background: #33465e; border-color: #47617f; }
    input[type=search] { width: 190px; }
    .spacer { flex: 1 1 auto; }
    .count, .pager { color: var(--dim); white-space: nowrap; }

    #grid {
        flex: 1 1 auto;
        display: grid;
        gap: 2px;
        padding: 2px;
        min-height: 0;
    }

    .tile {
        position: relative;
        background: #000;
        overflow: hidden;
        min-width: 0;
        min-height: 0;
    }

    .tile video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        display: block;
        cursor: pointer;
    }

    /* Fill mode: every tile is edge to edge and the overflow is cropped.
       One class on body does the whole grid, so a tile never has to be
       rebuilt to change how it sits. */
    body.fill .tile video { object-fit: cover; }

    body.fill #solo video {
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        object-fit: cover;
    }

    /* File names are noise in a grid you read as a wall, so the caption stays
       out of the way and only speaks up when a tile cannot decode. It keeps
       the path as its text either way, which is what that message is built
       from. */
    .cap {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 3px 6px;
        font-size: 11px;
        pointer-events: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }


    /* The scrubber. Hovering shows it at once, and the delay lives on the
       resting rule, so leaving the tile fades it out a second and a half
       later without a timer in JS. */
    .scrub {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 11px;
        cursor: pointer;
        opacity: 0;
        transition: opacity .2s linear 1.5s;
        touch-action: none;
    }

    .tile:hover .scrub,
    #solo:hover .scrub,
    .scrub.dragging {
        opacity: 1;
        transition-delay: 0s;
    }

    /* A clip with no usable duration cannot be scrubbed, so it does not
       pretend to offer it. */
    .tile.nodur .scrub,
    .tile.bad .scrub,
    #solo.nodur .scrub { display: none; }

    .scrub .track {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3px;
        background: rgba(255, 255, 255, .2);
    }

    .scrub:hover .track,
    .scrub.dragging .track { height: 5px; }

    .scrub .played {
        height: 100%;
        width: 0;
        background: var(--ink);
    }

    /* Solo has the room for a bar that is easier to hit. */
    #solo .scrub { height: 16px; }
    #solo .scrub .track { height: 4px; }
    /* A bad tile has no scrub bar under it, so this gradient runs clean to
       the bottom edge. */
    .tile.bad .cap {
        display: block;
        color: var(--bad);
        background: linear-gradient(transparent, rgba(0, 0, 0, .85));
    }
    .tile.bad video { outline: 1px solid var(--bad); outline-offset: -1px; }

    #empty {
        flex: 1 1 auto;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: var(--dim);
    }

    body.empty #grid { display: none; }
    body.empty #empty { display: flex; }

    #solo {
        position: fixed;
        inset: 0;
        background: #000;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 10;
        /* A zoomed clip is bigger than the window, and the overflow is the
           part you scrolled past rather than something to reveal. */
        overflow: hidden;
    }

    body.solo #solo { display: flex; }
    #solo video {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        /* Zoom is applied here. Origin at the corner keeps the anchor maths
           honest: a point maps to translate + point * scale, nothing else. */
        transform-origin: 0 0;
        will-change: transform;
    }

    /* Solo's step arrows. They answer to movement rather than to hover, so
       they are there the moment the mouse does anything and gone again when
       it settles. The specificity has to beat the shared button:disabled
       rule, or a disabled arrow would sit at its own opacity while the rest
       have faded out. */
    .soloarrow {
        position: absolute;
        top: 50%;
        margin-top: -32px;
        width: 44px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        font-size: 26px;
        line-height: 1;
        background: rgba(0, 0, 0, .5);
        border: 1px solid var(--line);
        color: var(--ink);
        cursor: pointer;
        z-index: 2;
    }

    #soloprev { left: 14px; }
    #solonext { right: 14px; }

    body.solo .soloarrow {
        opacity: 0;
        transition: opacity .2s;
        pointer-events: none;
    }

    body.solo.chrome .soloarrow {
        opacity: 1;
        pointer-events: auto;
    }

    body.solo.chrome .soloarrow:disabled {
        opacity: .2;
        cursor: default;
    }

    body.zoomed #solo video { cursor: grab; }
    body.zoomed.panning #solo video { cursor: grabbing; }

    #solocap {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        /* Padding lifts the text clear of the scrub bar while the gradient
           still runs all the way down, so there is no seam. */
        padding: 8px 12px 24px;
        font-size: 12px;
        color: var(--dim);
        background: linear-gradient(transparent, rgba(0, 0, 0, .9));
        text-align: center;
        pointer-events: none;
    }

    body.drop::after {
        content: "Drop a folder";
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(20, 40, 70, .75);
        font-size: 20px;
        color: #fff;
        z-index: 20;
        pointer-events: none;
    }
</style>

<header>
    <button id="pick" title="Choose the folder of clips">Change folder</button>
    <input id="filter" type="search" placeholder="Filter by name" autocomplete="off" spellcheck="false">
    <select id="per" title="Clips per page">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="4">4</option>
        <option value="6">6</option>
        <option value="8">8</option>
        <option value="12">12</option>
        <option value="16">16</option>
    </select>
    <select id="sort" title="Sort order">
        <option value="name">Name</option>
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
        <option value="largest">Largest</option>
        <option value="shuffle">Shuffle</option>
    </select>
    <button id="fill" title="Fill the tiles, cropping what doesn't fit (C)">Fit</button>
    <button id="mute" title="Mute (M)">Muted</button>
    <button id="pause" title="Pause all (Space)">Pause</button>
    <button id="resync" title="Restart together (R)">Resync</button>
    <button id="full" title="Fullscreen (F)">Fullscreen</button>
    <span class="spacer"></span>
    <span class="count" id="count"></span>
    <button id="prev" title="Previous page">&larr;</button>
    <span class="pager" id="pager"></span>
    <button id="next" title="Next page">&rarr;</button>
</header>

<div id="grid"></div>

<div id="empty">
    <div id="emptymsg">No folder chosen yet.</div>
    <button id="pick2">Choose a folder</button>
</div>

<div id="solo"><video id="solovid" loop playsinline></video>
    <button id="soloprev" class="soloarrow" title="Previous clip (left arrow)" aria-label="Previous clip">&lsaquo;</button>
    <button id="solonext" class="soloarrow" title="Next clip (right arrow)" aria-label="Next clip">&rsaquo;</button>
    <div id="solocap"></div>
</div>

<script>
(function () {
    'use strict';

    var LAYOUTS = { 1: [1, 1], 2: [2, 1], 4: [2, 2], 6: [3, 2], 8: [4, 2], 12: [4, 3], 16: [4, 4] };
    var CANPLAY_TIMEOUT = 5000;

    var state = {
        all: [], page: 0, per: 8, sort: "name", filter: "",
        muted: true, fill: false, paused: false, vids: [], soloIndex: -1, soloUrl: null
    };

    var collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
    var randByPath = Object.create(null);
    var thumbTried = Object.create(null);

    var $ = function (id) { return document.getElementById(id); };
    var grid = $('grid'), solo = $('solo'), solovid = $('solovid'), solocap = $('solocap');
    var soloprev = $('soloprev'), solonext = $('solonext');

    // Arbitrary filenames: #, ? and % are all legal and all break naive URL
    // building, so the whole path is encoded and decoded again in main.
    function clipUrl(p) {
        return 'clip://local/' + encodeURIComponent(String(p).replace(/\\/g, '/'));
    }

    function basename(rel) {
        var i = rel.lastIndexOf('/');
        return i < 0 ? rel : rel.slice(i + 1);
    }

    function fmtDuration(s) {
        if (!isFinite(s) || s <= 0) return '';
        var m = Math.floor(s / 60), r = s - m * 60;
        return m > 0 ? m + ':' + (r < 10 ? '0' : '') + r.toFixed(0) : r.toFixed(1) + 's';
    }

    // ---------------------------------------------------------- data

    // Replaces addFiles(FileList): the same job, over the array main sends.
    function setClips(list) {
        state.all = (list || []).map(function (c) {
            if (!(c.path in randByPath)) randByPath[c.path] = Math.random();
            return {
                path: c.path,
                rel: c.rel,
                name: basename(c.rel),
                size: c.size,
                time: c.time,
                rand: randByPath[c.path]
            };
        });
        render();
    }

    function visible() {
        var f = state.filter.trim().toLowerCase();
        var out = f ? state.all.filter(function (c) {
            return c.rel.toLowerCase().indexOf(f) >= 0;
        }) : state.all.slice();

        out.sort(function (a, b) {
            switch (state.sort) {
                case 'newest': return b.time - a.time;
                case 'oldest': return a.time - b.time;
                case 'largest': return b.size - a.size;
                case 'shuffle': return a.rand - b.rand;
                default: return collator.compare(a.rel, b.rel);
            }
        });
        return out;
    }

    function pageCount(vis) {
        return Math.max(1, Math.ceil(vis.length / state.per));
    }

    // ---------------------------------------------------------- rendering

    // Only the current page is ever decoding. This is the whole reason a folder
    // of 118 clips stays cheap, so nothing may hold a src past a page turn.
    function releaseUrls() {
        liveBars.clear();
        state.vids.forEach(function (v) {
            try {
                v.pause();
                v.removeAttribute('src');
                v.load();
            } catch (e) { /* a tile mid-teardown is not worth a throw */ }
        });
        state.vids = [];
    }

    function render() {
        releaseUrls();

        var vis = visible();
        var pages = pageCount(vis);
        if (state.page >= pages) state.page = pages - 1;
        if (state.page < 0) state.page = 0;

        var layout = LAYOUTS[state.per] || LAYOUTS[8];
        grid.style.gridTemplateColumns = 'repeat(' + layout[0] + ', 1fr)';
        grid.style.gridTemplateRows = 'repeat(' + layout[1] + ', 1fr)';
        grid.textContent = '';

        var start = state.page * state.per;
        var slice = vis.slice(start, start + state.per);
        var vids = [];

        slice.forEach(function (clip, i) {
            var tile = document.createElement('div');
            tile.className = 'tile';

            var v = document.createElement('video');
            v.loop = true;
            v.muted = state.muted;
            v.playsInline = true;
            v.preload = 'auto';

            var cap = document.createElement('div');
            cap.className = 'cap';
            cap.textContent = clip.rel;

            v.addEventListener('error', function () {
                tile.classList.add('bad');
                cap.textContent = clip.rel + " — can't decode";
            });

            var scrub = buildScrub(tile, v);

            v.addEventListener('loadedmetadata', function () {
                var d = fmtDuration(v.duration);
                if (d) cap.textContent = clip.rel + '  ' + d;
                // Without a real duration there is nothing to scrub along.
                tile.classList.toggle('nodur', !(isFinite(v.duration) && v.duration > 0));
            });

            v.addEventListener('click', function () { openSolo(start + i); });

            // Must be set before src. Without it the canvas poster fallback
            // hits a tainted-canvas error instead of a frame.
            v.crossOrigin = 'anonymous';
            v.src = clipUrl(clip.path);
            applyPoster(v, clip);

            tile.appendChild(v);
            tile.appendChild(cap);
            tile.appendChild(scrub);
            grid.appendChild(tile);
            vids.push(v);
        });

        state.vids = vids;
        document.body.classList.toggle('empty', state.all.length === 0);
        syncPlay();
        updateChrome(vis, pages);
    }

    // ---------------------------------------------------------- scrubber

    // One rAF loop drives every bar that is actually on screen, which is the
    // hovered tile and anything mid drag, so a page of sixteen is not paying
    // for fifteen invisible bars every frame.
    var liveBars = new Set();
    var rafId = 0;

    function tickBars() {
        rafId = 0;
        liveBars.forEach(function (bar) {
            var v = bar.video;
            // Covers a tile torn down by a page turn and the solo bar once solo
            // has closed, so nothing keeps ticking out of sight.
            if (!v.isConnected || !bar.scrub.offsetParent) { liveBars.delete(bar); return; }
            // Mid drag the bar answers to the pointer, not to where the
            // decoder has got to, or the two fight and it jitters.
            if (bar.dragging) return;
            if (isFinite(v.duration) && v.duration > 0) {
                bar.played.style.width = (v.currentTime / v.duration * 100) + '%';
            }
        });
        if (liveBars.size) rafId = requestAnimationFrame(tickBars);
    }

    function startBar(bar) {
        liveBars.add(bar);
        if (!rafId) rafId = requestAnimationFrame(tickBars);
    }

    function buildScrub(tile, v) {
        var scrub = document.createElement('div');
        scrub.className = 'scrub';
        var track = document.createElement('div');
        track.className = 'track';
        var played = document.createElement('div');
        played.className = 'played';
        track.appendChild(played);
        scrub.appendChild(track);

        var bar = { video: v, played: played, scrub: scrub, dragging: false };
        var dragging = false;
        var resumeOnRelease = false;

        // One seek in flight, and only ever the newest position. Writing
        // currentTime on every pointermove stacks seeks behind each other, and
        // that queue is what makes a drag lag and lets frames go missing: the
        // decoder is still serving a position the pointer left long ago.
        var wanted = null;
        var seeking = false;
        var watchdog = 0;

        function flushSeek() {
            if (seeking || wanted === null) return;
            if (!(isFinite(v.duration) && v.duration > 0)) { wanted = null; return; }
            var t = wanted;
            wanted = null;
            seeking = true;
            clearTimeout(watchdog);
            // A seek that never reports back must not wedge the bar for good.
            watchdog = setTimeout(function () { seeking = false; flushSeek(); }, 400);
            try {
                v.currentTime = t;
            } catch (e) {
                seeking = false;
            }
        }

        function seekDone() {
            clearTimeout(watchdog);
            seeking = false;
            flushSeek();
        }

        v.addEventListener('seeked', seekDone);
        v.addEventListener('error', seekDone);

        function seekTo(clientX) {
            if (!(isFinite(v.duration) && v.duration > 0)) return;
            var r = scrub.getBoundingClientRect();
            if (!r.width) return;
            var frac = (clientX - r.left) / r.width;
            if (!isFinite(frac)) return;
            frac = Math.max(0, Math.min(1, frac));

            // Landing exactly on the end wraps a looping clip straight back to
            // zero, which reads as the scrubber refusing to work at all.
            wanted = Math.min(frac * v.duration, Math.max(0, v.duration - 0.05));
            // The bar tracks the pointer at once, whatever the decoder is
            // still catching up with.
            played.style.width = (frac * 100) + '%';
            flushSeek();
        }

        // The bar only needs to move while it is visible, so hovering the tile
        // is what starts it.
        tile.addEventListener('mouseenter', function () { startBar(bar); });
        tile.addEventListener('mouseleave', function () {
            if (!dragging) liveBars.delete(bar);
        });

        scrub.addEventListener('pointerdown', function (e) {
            if (e.button !== 0) return;
            // Without this the tile underneath takes the click and opens solo.
            e.preventDefault();
            e.stopPropagation();
            dragging = true;
            bar.dragging = true;
            scrub.classList.add('dragging');
            startBar(bar);
            // A playing clip fights every seek, so the drag takes the clip and
            // hands it back on release. Paused is also what makes the frame
            // under the pointer actually stay on screen.
            resumeOnRelease = !v.paused;
            if (resumeOnRelease) v.pause();
            try { scrub.setPointerCapture(e.pointerId); } catch (err) { /* fine */ }
            seekTo(e.clientX);
        });

        scrub.addEventListener('pointermove', function (e) {
            if (dragging) seekTo(e.clientX);
        });

        function endDrag(e) {
            if (!dragging) return;
            dragging = false;
            bar.dragging = false;
            scrub.classList.remove('dragging');
            try { scrub.releasePointerCapture(e.pointerId); } catch (err) { /* fine */ }
            // Give it back, unless everything is paused on purpose.
            if (resumeOnRelease && !state.paused) {
                var q = v.play();
                if (q && q.catch) q.catch(function () { /* nothing to do */ });
            }
            resumeOnRelease = false;
            if (!tile.matches(':hover')) liveBars.delete(bar);
        }

        scrub.addEventListener('pointerup', endDrag);
        scrub.addEventListener('pointercancel', endDrag);

        // A click here is a seek, never a solo.
        scrub.addEventListener('click', function (e) { e.stopPropagation(); });

        return scrub;
    }

    // Posters come from the cache in main. Where there is no ffmpeg the tile
    // paints its own first frame once and hands it back to be cached.
    function applyPoster(v, clip) {
        window.api.getThumb(clip.path, clip.time).then(function (url) {
            if (url && v.isConnected) {
                v.poster = url;
            } else if (!thumbTried[clip.path]) {
                thumbTried[clip.path] = true;
                captureThumb(v, clip);
            }
        }).catch(function () { /* a missing poster costs a black frame, nothing more */ });
    }

    function captureThumb(v, clip) {
        var done = false;
        function grab() {
            if (done || !v.isConnected || !v.videoWidth) return;
            done = true;
            try {
                var w = Math.min(640, v.videoWidth);
                var h = Math.round(v.videoHeight * (w / v.videoWidth));
                var c = document.createElement('canvas');
                c.width = w;
                c.height = h;
                c.getContext('2d').drawImage(v, 0, 0, w, h);
                window.api.saveThumb(clip.path, clip.time, c.toDataURL('image/png'));
            } catch (e) { /* tainted or torn down, skip it */ }
        }
        // getThumb is a round trip to main, so the clip may already have data by
        // the time this runs. Waiting on loadeddata alone misses those and the
        // poster never gets cached.
        if (v.readyState >= 2) grab();
        else v.addEventListener('loadeddata', grab, { once: true });
    }

    // Waits for every tile on the page, then starts them on the same frame.
    // The identity check is the guard against a page change landing mid-wait:
    // an older page's resolve must not restart the new page's tiles.
    function syncPlay() {
        var mine = state.vids;
        if (!mine.length) return;

        Promise.all(mine.map(function (v) {
            return new Promise(function (resolve) {
                if (v.readyState >= 3) return resolve();
                var t = setTimeout(finish, CANPLAY_TIMEOUT);
                function finish() {
                    clearTimeout(t);
                    v.removeEventListener('canplay', finish);
                    v.removeEventListener('error', finish);
                    resolve();
                }
                v.addEventListener('canplay', finish);
                v.addEventListener('error', finish);
            });
        })).then(function () {
            if (state.vids !== mine) return;
            mine.forEach(function (v) {
                try {
                    v.currentTime = 0;
                    if (!state.paused) {
                        var p = v.play();
                        if (p && p.catch) p.catch(function () { /* autoplay refused, R retries */ });
                    }
                } catch (e) { /* a bad tile must not stop the rest */ }
            });
        });
    }

    function updateChrome(vis, pages) {
        vis = vis || visible();
        pages = pages || pageCount(vis);

        var total = state.all.length;
        var shown = vis.length;
        $('count').textContent = shown === total
            ? total + (total === 1 ? ' clip' : ' clips')
            : shown + ' of ' + total;

        $('pager').textContent = shown ? (state.page + 1) + ' / ' + pages : '0 / 0';
        $('prev').disabled = state.page <= 0;
        $('next').disabled = state.page >= pages - 1;
        $('mute').textContent = state.muted ? 'Muted' : 'Sound';
        $('mute').classList.toggle('on', !state.muted);
        $('fill').textContent = state.fill ? 'Fill' : 'Fit';
        $('fill').classList.toggle('on', state.fill);
        $('pause').textContent = state.paused ? 'Play' : 'Pause';
        $('pause').classList.toggle('on', state.paused);
    }

    // ---------------------------------------------------------- paging

    function go(delta) {
        var vis = visible();
        var pages = pageCount(vis);
        var next = state.page + delta;
        if (next < 0 || next >= pages) return;
        state.page = next;
        save({ page: state.page });
        render();
    }

    // ---------------------------------------------------------- solo

    function openSolo(index) {
        var vis = visible();
        if (index < 0 || index >= vis.length) return;
        var clip = vis[index];

        // Every clip starts fitted. Carrying a zoom across to the next one
        // means landing somewhere with no idea where you are.
        resetZoom();

        state.soloIndex = index;
        state.soloUrl = clipUrl(clip.path);
        solovid.muted = state.muted;
        solovid.src = state.soloUrl;
        solocap.textContent = clip.rel;
        soloprev.disabled = index <= 0;
        solonext.disabled = index >= vis.length - 1;
        document.body.classList.add('solo');
        showChrome();

        var p = solovid.play();
        if (p && p.catch) p.catch(function () { /* same as the grid */ });
    }

    function stepSolo(delta) {
        if (state.soloIndex < 0) return;
        var vis = visible();
        var next = state.soloIndex + delta;
        if (next < 0 || next >= vis.length) return;
        openSolo(next);
    }

    // Closing returns to the page holding that clip, which is not always the
    // page it was opened from once the arrows have walked across a boundary.
    function closeSolo() {
        if (state.soloIndex < 0) return;
        var index = state.soloIndex;

        document.body.classList.remove('solo');
        hideChrome();
        resetZoom();
        try {
            solovid.pause();
            solovid.removeAttribute('src');
            solovid.load();
        } catch (e) { /* nothing to do */ }
        state.soloIndex = -1;
        state.soloUrl = null;

        var target = Math.floor(index / state.per);
        if (target !== state.page) {
            state.page = target;
            save({ page: state.page });
            render();
        }
    }

    // ---------------------------------------------------------- solo chrome

    // The arrows answer to movement, not to hover, so they are up the moment
    // the mouse does anything and gone again once it settles.
    var CHROME_IDLE = 1500;
    var chromeTimer = 0;

    function showChrome() {
        if (state.soloIndex < 0) return;
        document.body.classList.add('chrome');
        clearTimeout(chromeTimer);
        chromeTimer = setTimeout(function () {
            document.body.classList.remove('chrome');
        }, CHROME_IDLE);
    }

    function hideChrome() {
        clearTimeout(chromeTimer);
        chromeTimer = 0;
        document.body.classList.remove('chrome');
    }

    // ---------------------------------------------------------- solo sizing

    // Solo fills the window. Left to the stylesheet a clip smaller than the
    // screen sits at its own resolution in the middle of all that black, which
    // is not what solo is for. Sizing the element to the fitted box rather than
    // letterboxing inside a full-window box keeps the element and the picture
    // the same rectangle, which is what the zoom maths is written against.
    function sizeSolo() {
        var vw = solovid.videoWidth;
        var vh = solovid.videoHeight;

        if (state.fill) {
            // Fill mode wants the container and a cropped picture, which the
            // stylesheet already says. Inline sizes would only fight it.
            solovid.style.width = '';
            solovid.style.height = '';
            return;
        }

        if (!vw || !vh) return;
        var host = solo.getBoundingClientRect();
        if (!host.width || !host.height) return;

        var f = Math.min(host.width / vw, host.height / vh);
        solovid.style.width = Math.round(vw * f) + 'px';
        solovid.style.height = Math.round(vh * f) + 'px';
    }

    // ---------------------------------------------------------- zoom

    var ZOOM_MIN = 1;
    var ZOOM_MAX = 8;
    var zoom = 1;
    var panX = 0;
    var panY = 0;
    var panning = false;
    var panFromX = 0;
    var panFromY = 0;
    var panMoved = false;

    // offsetWidth and its neighbours ignore the transform, so they keep
    // reporting the untransformed box however far in the zoom has gone. That
    // is what the anchor maths has to be written against.
    function soloBase() {
        var host = solo.getBoundingClientRect();
        return {
            host: host,
            left: host.left + solovid.offsetLeft,
            top: host.top + solovid.offsetTop,
            w: solovid.offsetWidth,
            h: solovid.offsetHeight
        };
    }

    // Two rules, and they turn out to be the same two numbers either way round.
    // Bigger than the window, no edge may come inside it. Smaller than the
    // window, no edge may leave it. Snapping the small case back to centred
    // instead would cancel the cursor anchoring on whichever axis is
    // letterboxed, which is most of them.
    function clampPan(b) {
        function fit(pan, hostNear, hostFar, base, size) {
            var a = hostNear - base;
            var c = hostFar - base - size;
            return Math.min(Math.max(pan, Math.min(a, c)), Math.max(a, c));
        }

        panX = fit(panX, b.host.left, b.host.right, b.left, b.w * zoom);
        panY = fit(panY, b.host.top, b.host.bottom, b.top, b.h * zoom);
    }

    function applyZoom() {
        if (zoom <= 1.0001) {
            zoom = 1;
            panX = 0;
            panY = 0;
            solovid.style.transform = '';
            document.body.classList.remove('zoomed');
            return;
        }
        document.body.classList.add('zoomed');
        solovid.style.transform =
            'translate(' + panX + 'px, ' + panY + 'px) scale(' + zoom + ')';
    }

    function resetZoom() {
        zoom = 1;
        panX = 0;
        panY = 0;
        panning = false;
        panMoved = false;
        document.body.classList.remove('zoomed', 'panning');
        solovid.style.transform = '';
    }

    function zoomAt(clientX, clientY, factor) {
        var b = soloBase();
        if (!b.w || !b.h) return;

        var next = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoom * factor));
        if (next === zoom) return;

        // Whatever is under the cursor stays under the cursor. With the origin
        // at the corner a point maps to pan + point * zoom, so holding it still
        // across a scale change is one line each way.
        var cx = clientX - b.left;
        var cy = clientY - b.top;
        var k = next / zoom;
        panX = cx - (cx - panX) * k;
        panY = cy - (cy - panY) * k;
        zoom = next;

        clampPan(b);
        applyZoom();
    }

    // ---------------------------------------------------------- controls

    function setMuted(m) {
        state.muted = m;
        state.vids.forEach(function (v) { v.muted = m; });
        solovid.muted = m;
        save({ muted: m });
        updateChrome();
    }

    function setFill(f) {
        state.fill = f;
        document.body.classList.toggle('fill', f);
        save({ fill: f });
        // Fit and fill are different rectangles, so solo has to be re-sized
        // rather than left holding the one the other mode wanted.
        if (state.soloIndex >= 0) {
            resetZoom();
            sizeSolo();
        }
        updateChrome();
    }

    function setPaused(p) {
        state.paused = p;
        state.vids.forEach(function (v) {
            try {
                if (p) v.pause();
                else { var q = v.play(); if (q && q.catch) q.catch(function () {}); }
            } catch (e) { /* skip */ }
        });
        try {
            if (state.soloIndex >= 0) {
                if (p) solovid.pause();
                else { var s = solovid.play(); if (s && s.catch) s.catch(function () {}); }
            }
        } catch (e) { /* skip */ }
        updateChrome();
    }

    function toggleFullscreen() {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen().catch(function () {});
    }

    function save(partial) {
        try {
            window.api.saveState(partial);
        } catch (e) { /* settings that will not save are not worth a crash */ }
    }

    // ---------------------------------------------------------- events

    $('pick').addEventListener('click', choose);
    $('pick2').addEventListener('click', choose);

    function choose() {
        window.api.pickFolder().then(function (folder) {
            if (folder) {
                state.page = 0;
                load(folder);
            }
        });
    }

    $('filter').addEventListener('input', function (e) {
        state.filter = e.target.value;
        state.page = 0;
        render();
    });

    // The dropdowns give focus back so the single-key shortcuts keep working
    // straight after a change.
    $('per').addEventListener('change', function (e) {
        state.per = parseInt(e.target.value, 10) || 8;
        state.page = 0;
        save({ per: state.per, page: 0 });
        e.target.blur();
        render();
    });

    $('sort').addEventListener('change', function (e) {
        state.sort = e.target.value;
        state.page = 0;
        save({ sort: state.sort, page: 0 });
        e.target.blur();
        render();
    });

    $('fill').addEventListener('click', function () { setFill(!state.fill); });
    $('mute').addEventListener('click', function () { setMuted(!state.muted); });
    $('pause').addEventListener('click', function () { setPaused(!state.paused); });
    $('resync').addEventListener('click', function () { syncPlay(); });
    $('full').addEventListener('click', toggleFullscreen);
    $('prev').addEventListener('click', function () { go(-1); });
    $('next').addEventListener('click', function () { go(1); });
    solo.addEventListener('click', function () {
        // A pan ends in a click. That must not also close the view.
        if (panMoved) { panMoved = false; return; }
        closeSolo();
    });

    solo.addEventListener('wheel', function (e) {
        if (state.soloIndex < 0) return;
        e.preventDefault();
        // Lines rather than pixels on some mice, so put both on one scale.
        var dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
        zoomAt(e.clientX, e.clientY, Math.exp(-dy * 0.0015));
    }, { passive: false });

    solo.addEventListener('pointerdown', function (e) {
        if (e.button !== 0 || zoom <= 1) return;
        panning = true;
        panMoved = false;
        panFromX = e.clientX;
        panFromY = e.clientY;
        document.body.classList.add('panning');
        try { solo.setPointerCapture(e.pointerId); } catch (err) { /* fine */ }
    });

    solo.addEventListener('pointermove', function (e) {
        if (!panning) return;
        var dx = e.clientX - panFromX;
        var dy = e.clientY - panFromY;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) panMoved = true;
        panFromX = e.clientX;
        panFromY = e.clientY;
        panX += dx;
        panY += dy;
        clampPan(soloBase());
        applyZoom();
    });

    function endPan(e) {
        if (!panning) return;
        panning = false;
        document.body.classList.remove('panning');
        try { solo.releasePointerCapture(e.pointerId); } catch (err) { /* fine */ }
    }

    solo.addEventListener('pointerup', endPan);
    solo.addEventListener('pointercancel', endPan);

    solo.addEventListener('pointermove', showChrome);

    function stepButton(btn, delta) {
        // The overlay closes on click and pans on pointerdown, so the arrow has
        // to stop both before either one reaches it.
        btn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
        btn.addEventListener('click', function (e) {
            e.stopPropagation();
            stepSolo(delta);
            showChrome();
        });
    }

    stepButton(soloprev, -1);
    stepButton(solonext, 1);

    // A resized window changes the box the clamp is written against.
    window.addEventListener('resize', function () {
        if (state.soloIndex < 0) return;
        sizeSolo();
        if (zoom > 1) { clampPan(soloBase()); applyZoom(); }
    });

    // Solo gets the same bar as a tile, built once because the element is
    // static. Its click handler stops there, so scrubbing never closes solo.
    solo.appendChild(buildScrub(solo, solovid));
    solovid.addEventListener('loadedmetadata', function () {
        solo.classList.toggle('nodur', !(isFinite(solovid.duration) && solovid.duration > 0));
        sizeSolo();
    });

    document.addEventListener('keydown', function (e) {
        var t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT')) return;
        if (e.ctrlKey || e.altKey || e.metaKey) return;

        switch (e.key) {
            case 'ArrowLeft':
                e.preventDefault();
                if (state.soloIndex >= 0) stepSolo(-1); else go(-1);
                return;
            case 'ArrowRight':
                e.preventDefault();
                if (state.soloIndex >= 0) stepSolo(1); else go(1);
                return;
            case 'Escape':
                if (state.soloIndex >= 0) { e.preventDefault(); closeSolo(); }
                return;
            case ' ':
                e.preventDefault();
                setPaused(!state.paused);
                return;
        }

        var k = e.key.toLowerCase();
        if (k === 'r') { e.preventDefault(); syncPlay(); return; }
        if (k === 'm') { e.preventDefault(); setMuted(!state.muted); return; }
        if (k === 'c') { e.preventDefault(); setFill(!state.fill); return; }
        if (k === 'f') { e.preventDefault(); toggleFullscreen(); return; }
        if (e.key === '0' && state.soloIndex >= 0) { e.preventDefault(); resetZoom(); return; }

        if (e.key >= '1' && e.key <= '9') {
            var slot = parseInt(e.key, 10) - 1;
            if (slot < state.vids.length) {
                e.preventDefault();
                openSolo(state.page * state.per + slot);
            }
        }
    });

    window.addEventListener('dragover', function (e) {
        e.preventDefault();
        document.body.classList.add('drop');
    });

    window.addEventListener('dragleave', function (e) {
        if (e.relatedTarget === null) document.body.classList.remove('drop');
    });

    window.addEventListener('drop', function (e) {
        e.preventDefault();
        document.body.classList.remove('drop');
        var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (!f) return;
        var p = window.api.pathForFile(f);
        if (!p) return;
        window.api.setFolderFromDrop(p).then(function (folder) {
            if (folder) {
                state.page = 0;
                load(folder);
            }
        });
    });

    window.api.onClipsChanged(function () {
        window.api.listClips().then(function (list) {
            setClips(list);
        }).catch(function () {});
    });

    // ---------------------------------------------------------- boot

    function load(folder) {
        $('emptymsg').textContent = 'Reading ' + folder;
        document.body.classList.add('empty');
        window.api.listClips(folder).then(function (list) {
            if (!list.length) $('emptymsg').textContent = 'No clips under ' + folder;
            setClips(list);
        }).catch(function () {
            $('emptymsg').textContent = 'Could not read ' + folder;
        });
    }

    window.api.getState().then(function (s) {
        state.per = s.per || 8;
        state.sort = s.sort || 'name';
        state.muted = s.muted !== false;
        state.fill = s.fill === true;
        state.page = s.page || 0;
        document.body.classList.toggle('fill', state.fill);

        $('per').value = String(state.per);
        $('sort').value = state.sort;
        updateChrome([], 1);

        if (s.folder) load(s.folder);
        else document.body.classList.add('empty');
    });
})();
</script>
